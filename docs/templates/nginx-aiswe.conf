# Reference copy of the Nginx site for aiswe.uwb.edu as verified on 2026-10-31
# (docs/verification-history.md), sanitized: Certbot's certificate directives
# are left as comments, the redirect server is shown in Certbot's usual form,
# and an unrelated location that proxies another application on this host is
# omitted. Not installed by any script; the live file is
# /etc/nginx/conf.d/aiswe.conf. Check with `sudo nginx -t`, apply with
# `sudo systemctl reload nginx`. Rationale for every /api/ directive:
# docs/deployment.md, "Nginx notes for sessions".
server {
    server_name aiswe.uwb.edu;
    root /usr/share/nginx/html;

    # The SPA: /join, /join/<code>, /invite/<token> and /login are frontend routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the browser and the Tillicum worker send to the application.
    location /api/ {
        # A 10 MB syllabus plus its multipart envelope (MAX_SYLLABUS_BYTES).
        client_max_body_size 11m;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Per-client throttles depend on this; uvicorn trusts it from loopback only.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 150 s in the backend's queue + 120 s generating must finish before
        # Nginx gives up, so the backend answers "busy" itself
        # (backend/app/generation_queue.py). Raise together with the queue timeout.
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        # Do not add proxy_intercept_errors: the backend's JSON refusals must
        # reach browsers and the Tillicum worker unchanged.
    }

    listen 443 ssl; # managed by Certbot
    # http2 on;     # recommended, not yet applied: lifts the browser's six-connections-per-origin limit
    # ssl_certificate /etc/letsencrypt/live/aiswe.uwb.edu/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/aiswe.uwb.edu/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = aiswe.uwb.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aiswe.uwb.edu;
    return 404; # managed by Certbot
}
